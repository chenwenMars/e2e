[package]
name = "e2e-desktop-napi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The macOS accessibility driver of @e2e-dev/desktop, loaded into Node through NAPI-RS"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "block2"] }
block2 = "0.6"
libc = "0.2"

[build-dependencies]
napi-build = "2"
